name: Generate test matrices pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check out'
        default: 'main'
        required: false
        type: string
      pr_number:
        description: 'PR number to process (must be specified as a number or "all")'
        required: true
        type: string
      gh_pages_branch:
        description: 'GitHub pages branch to update'
        default: 'gh-pages'
        required: false
        type: string
permissions:
  contents: write
  issues: write
jobs:
  generate-matrix:
    if: github.event_name != 'push' || github.repository == 'rh-ecosystem-edge/amd-ci'
    runs-on: ubuntu-latest
    env:
      DASHBOARD_OUTPUT_DIR: 'workflows/gpu_operator_dashboard/output'
      BROKEN_VERSIONS_FILEPATH: 'workflows/gpu_operator_versions/broken_versions.json'
    steps:
      - name: Set dynamic env vars
        run: |
          echo "DASHBOARD_DATA_FILEPATH=${DASHBOARD_OUTPUT_DIR}/gpu_operator_matrix.json" >> "$GITHUB_ENV"
          echo "DASHBOARD_HTML_FILEPATH=${DASHBOARD_OUTPUT_DIR}/gpu_operator_matrix.html" >> "$GITHUB_ENV"
          echo "GH_PAGES_BRANCH=${{ github.event.inputs.gh_pages_branch || 'gh-pages' }}" >> "$GITHUB_ENV"
        env:
          DASHBOARD_OUTPUT_DIR: ${{ env.DASHBOARD_OUTPUT_DIR }}
      - name: Determine PR Number
        id: determine_pr
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
              echo "Finding PR associated with merge commit."
              # Find the PR number from the merge commit
              PR_NUMBER=$(gh pr list -R ${{ github.repository }} --state merged --json number,mergeCommit --jq ".[] | select(.mergeCommit.oid == \"${{ github.sha }}\") | .number")
              if [ -z "$PR_NUMBER" ]; then
                echo "No PR found for this push, skipping dashboard generation."
                echo "PR_NUMBER=" >> "$GITHUB_OUTPUT"
              else
                echo "Processing merged pull request #$PR_NUMBER"
                echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              fi
          else
              echo "PR_NUMBER=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Checkout GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GH_PAGES_BRANCH }}
          path: ${{ env.DASHBOARD_OUTPUT_DIR }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install -r workflows/gpu_operator_dashboard/requirements.txt

      - name: Fetch CI Data
        if: steps.determine_pr.outputs.PR_NUMBER != ''
        run: |
          echo "Processing PR: ${{ steps.determine_pr.outputs.PR_NUMBER }}"
          python -m workflows.gpu_operator_dashboard.fetch_ci_data \
            --pr_number "${{ steps.determine_pr.outputs.PR_NUMBER }}" \
            --baseline_data_filepath "${{ env.DASHBOARD_DATA_FILEPATH }}" \
            --merged_data_filepath "${{ env.DASHBOARD_DATA_FILEPATH }}" \
            --broken_versions_filepath "${{ env.BROKEN_VERSIONS_FILEPATH }}"

      - name: Generate HTML Dashboard (only if JSON changed)
        if: steps.determine_pr.outputs.PR_NUMBER != ''
        run: |
          cd "${{ env.DASHBOARD_OUTPUT_DIR }}"
          if [[ ${{ github.event_name }} == "push" ]] && git diff --exit-code gpu_operator_matrix.json; then
            echo "no changes"
          else
            cd "${{ github.workspace }}"
            python -m workflows.gpu_operator_dashboard.generate_ci_dashboard \
              --dashboard_data_filepath "${{ env.DASHBOARD_DATA_FILEPATH }}" \
              --dashboard_html_filepath "${{ env.DASHBOARD_HTML_FILEPATH }}" \
              --broken_versions_filepath "${{ env.BROKEN_VERSIONS_FILEPATH }}"
          fi

      - name: Deploy HTML to GitHub Pages
        if: steps.determine_pr.outputs.PR_NUMBER != ''
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ env.GH_PAGES_BRANCH }}
          folder: ${{ env.DASHBOARD_OUTPUT_DIR }}
          clean: false
          force: false

      - name: Delete merged branch
        if: |
          github.event_name == 'push' &&
          steps.determine_pr.outputs.PR_NUMBER != ''
        run: |
          # Get PR details to check if it was created by github-actions bot
          PR_AUTHOR=$(gh pr view -R ${{ github.repository }} ${{ steps.determine_pr.outputs.PR_NUMBER }} --json author --jq '.author.login')
          BRANCH=$(gh pr view -R ${{ github.repository }} ${{ steps.determine_pr.outputs.PR_NUMBER }} --json headRefName --jq '.headRefName')

          if [ "$PR_AUTHOR" == "github-actions[bot]" ]; then
            echo "Deleting merged branch: $BRANCH"
            git push origin --delete "$BRANCH" || echo "Branch $BRANCH already deleted or doesn't exist"
          else
            echo "PR was not created by github-actions bot, skipping branch deletion"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
