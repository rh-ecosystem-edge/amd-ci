<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMD GPU Operator CI &#8212; Test Matrix</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      line-height: 1.5;
      font-size: 14px;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    /* Page header */
    .page-header {
      background: linear-gradient(135deg, #1a365d 0%, #2a4a80 100%);
      color: white;
      padding: 26px 0;
      margin-bottom: 24px;
    }
    .page-header .container { display: flex; align-items: center; gap: 16px; }
    .page-header h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
    .page-header p { opacity: 0.7; font-size: 13px; margin-top: 3px; }

    /* Summary stats */
    .summary-stats { display: flex; gap: 16px; margin-bottom: 20px; }
    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 18px 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      flex: 1;
      text-align: center;
    }
    .stat-number { display: block; font-size: 30px; font-weight: 700; color: #1a365d; line-height: 1.1; }
    .stat-number.rate-high { color: #16a34a; }
    .stat-number.rate-mid  { color: #d97706; }
    .stat-number.rate-low  { color: #dc2626; }
    .stat-label { display: block; font-size: 11px; color: #64748b; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Chart */
    .chart-section {
      background: white;
      border-radius: 10px;
      padding: 18px 24px 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }
    .chart-title { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }
    .chart-wrapper { height: 180px; position: relative; }

    /* TOC */
    .toc {
      background: white;
      border-radius: 10px;
      padding: 13px 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .toc-label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .toc a {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #1a365d;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid #e2e8f0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .toc a:hover { background: #1a365d; color: white; border-color: #1a365d; }

    /* OCP sections */
    .ocp-section { background: white; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 24px; overflow: hidden; }
    .ocp-section-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 20px; background: #1e3a5f; color: white; }
    .ocp-section-title { font-size: 16px; font-weight: 700; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-success { background: #dcfce7; color: #15803d; }
    .badge-failure { background: #fee2e2; color: #dc2626; }
    .badge-mixed   { background: #fef3c7; color: #b45309; }

    /* Notes */
    .notes-section { padding: 10px 20px; background: #fffbeb; border-bottom: 1px solid #fde68a; font-size: 13px; color: #92400e; }
    .notes-section ul { list-style: none; }
    .notes-section li::before { content: "\26A0  "; }
    .notes-section li + li { margin-top: 3px; }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 9px 16px;
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    tbody tr { border-bottom: 1px solid #f1f5f9; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }
    tbody td { padding: 11px 16px; vertical-align: top; }
    .td-ocp { color: #475569; font-size: 13px; font-weight: 500; white-space: nowrap; }
    .td-gpu a { color: #1d4ed8; text-decoration: none; font-weight: 600; font-size: 13px; }
    .td-gpu a:hover { text-decoration: underline; }

    /* Test details collapsible */
    .no-details { color: #cbd5e1; font-size: 13px; }

    details.test-details summary {
      cursor: pointer;
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 6px;
      background: #f1f5f9;
      font-size: 12px;
      color: #64748b;
      user-select: none;
      border: 1px solid #e2e8f0;
    }
    details.test-details summary::-webkit-details-marker { display: none; }
    details.test-details summary:hover { background: #e2e8f0; }
    details.test-details[open] summary { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }

    .test-details-body {
      margin-top: 8px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      background: white;
    }
    .test-group { padding: 8px 12px; }
    .test-group + .test-group { border-top: 1px solid #f1f5f9; }
    .test-group-name { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .test-item { font-size: 12px; padding: 1px 0; }
    .test-item.passed { color: #15803d; }
    .test-item.failed { color: #dc2626; }
    .test-item.skipped { color: #b45309; }

    /* Footer */
    .last-updated { text-align: center; padding: 32px 0 40px; color: #94a3b8; font-size: 12px; }

    @media (max-width: 640px) {
      .summary-stats { flex-direction: column; }
      .chart-wrapper { height: 140px; }
      thead th:last-child, tbody td:last-child { display: none; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <div class="container">
      <div>
        <h1>AMD GPU Operator CI</h1>
        <p>Test Matrix: AMD GPU Operator on Red Hat OpenShift</p>
      </div>
    </div>
  </div>
  <div class="container">
